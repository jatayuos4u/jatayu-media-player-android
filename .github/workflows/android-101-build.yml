name: Android 1.0.1 build (unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-video-resume-1.0.1

permissions:
  contents: read

concurrency:
  group: android-101-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      QT_ANDROID_ROOT: ${{ github.workspace }}/Qt/6.11.3/android_arm64_v8a
      QT_HOST_PATH: ${{ github.workspace }}/Qt/6.11.3/gcc_64
      BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3-pip ffmpeg libgl1 libegl1 libxkbcommon0
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "platform-tools"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install Qt Android and matching host kit
        run: |
          python3 -m pip install --user --break-system-packages aqtinstall
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m aqt install-qt linux desktop 6.11.3 linux_gcc_64 -m qtmultimedia qtshadertools -O "$GITHUB_WORKSPACE/Qt"
          python3 -m aqt install-qt all_os android 6.11.3 android_arm64_v8a -m qtmultimedia qtshadertools -O "$GITHUB_WORKSPACE/Qt"
      - name: Build unsigned Android APK
        env:
          QT_ANDROID_ROOT: ${{ github.workspace }}/Qt/6.11.3/android_arm64_v8a
          QT_HOST_PATH: ${{ github.workspace }}/Qt/6.11.3/gcc_64
        run: |
          bash scripts/build-android-arm64.sh
      - name: Check generated APK and calculate digest
        run: |
          find build/android-arm64 -type f -name '*.apk' -print
          test "$(find build/android-arm64 -type f -name '*.apk' | wc -l)" -ge 1
          find build/android-arm64 -type f -name '*.apk' -exec sha256sum {} \;
      - name: Upload unsigned test APK
        uses: actions/upload-artifact@v4
        with:
          name: Jatayu-Android-1.0.1-UNSIGNED-TEST
          path: build/android-arm64/**/*.apk
          retention-days: 3
          if-no-files-found: error
